  :root{
    --paper:#FBF6EA;
    --paper-line:#E3D9C4;
    --ink:#2B3A55;
    --ink-soft:#5B6B8C;
    --coral:#FF6B6B;
    --coral-dk:#E24E4E;
    --sky:#3D9DD9;
    --sky-dk:#1F7FB8;
    --sun:#F3A712;
    --sun-dk:#D68E00;
    --grass:#3FA66B;
    --grass-dk:#2C8654;
    --rose:#E2536B;
    --rose-dk:#C43955;
    --teal:#2FA8A0;
    --teal-dk:#1F8B84;
    --purple:#8B6FD1;
    --purple-dk:#6E4FC0;
    --pink:#E0629C;
    --pink-dk:#C24884;
    --brown:#B98644;
    --brown-dk:#96692F;
    --card-bg:#FFFDF8;
    --shadow: 0 6px 0 rgba(43,58,85,0.08);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:
      repeating-linear-gradient(
        var(--paper),
        var(--paper) 34px,
        var(--paper-line) 35px
      );
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    min-height:100vh;
  }

  /* spiral binder rail */
  .binder{
    position:fixed;
    left:0; top:0; bottom:0;
    width:34px;
    background:linear-gradient(180deg,#EFE6D2,#E7DCC4);
    border-right:2px solid var(--paper-line);
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:70px;
    gap:26px;
  }
  .binder .ring{
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #cfc4a8 60%, #a99a76);
    box-shadow: inset 0 0 0 2px #FBF6EA, 0 1px 2px rgba(0,0,0,.25);
  }
  @media (max-width:720px){ .binder{ display:none; } }

  .page{
    margin-left:34px;
    padding:28px 20px 90px;
    max-width:1100px;
    margin-inline:auto;
  }
  @media (max-width:720px){ .page{ margin-left:0; } }

  /* HEADER */
  header.top{
    text-align:center;
    padding: 6px 10px 22px;
    position:relative;
  }
  header.top .eyebrow{
    font-family:'Caveat', cursive;
    font-size:1.35rem;
    color:var(--coral-dk);
    transform:rotate(-2deg);
    display:inline-block;
    margin-bottom:2px;
  }
  header.top h1{
    font-family:'Fredoka', sans-serif;
    font-weight:800;
    font-size:clamp(1.7rem, 4.2vw, 2.6rem);
    margin:0 0 6px;
    color:var(--ink);
    letter-spacing:.5px;
  }
  header.top h1 span.tag{
    background:var(--sun);
    color:#fff;
    padding:2px 12px;
    border-radius:8px;
    box-shadow: var(--shadow);
    display:inline-block;
    transform:rotate(-1deg);
  }
  header.top p.sub{
    font-size:.95rem;
    color:var(--ink-soft);
    margin:0;
  }

  /* CONTROL BAR */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
    background:var(--card-bg);
    border:2px solid var(--ink);
    border-radius:16px;
    padding:12px 16px;
    margin:18px auto 26px;
    max-width:900px;
    box-shadow:var(--shadow);
  }
  .switch-wrap{
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:.88rem; color:var(--ink-soft);
  }
  .switch{
    width:42px; height:24px; border-radius:999px;
    background:#D8CFC0; position:relative; cursor:pointer; flex:none;
  }
  .switch::after{
    content:''; position:absolute; top:3px; left:3px;
    width:18px; height:18px; border-radius:50%; background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.3);
    transition:.15s;
  }
  .switch.on{ background:var(--coral); }
  .switch.on::after{ left:21px; }

  #search{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    border:2px solid var(--ink);
    border-radius:999px;
    padding:8px 16px;
    font-size:.9rem;
    outline:none;
    width:190px;
    background:#fff;
  }
  #search:focus{ border-color:var(--sky); }

  .voice-status{
    width:100%;

// ---------- render ----------
const grid = document.getElementById('grid');
const emptyNote = document.getElementById('emptyNote');

function renderCards(list){
  grid.innerHTML = '';
  if(list.length === 0){ emptyNote.style.display = 'block'; return; }
  emptyNote.style.display = 'none';
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = item.cat;
    card.dataset.en = item.en.toLowerCase();
    card.dataset.zh = item.zh;
    card.innerHTML = `
      <span class="badge">No.${item.no}</span>
      <div class="word-row">
        <h3>${item.en}</h3>
        <button class="speak-btn" data-say="${escapeAttr(item.en)}" title="播放單字">🔊</button>
      </div>
      <div class="zh-meaning">${item.zh}</div>
      <div class="sentence-box">
        <div class="sentence-en">${highlightKeyWord(item.s, item.en)}</div>
        <div class="sentence-zh">${item.sz}</div>
        <button class="sent-play" data-say="${escapeAttr(item.s)}">▶ 播放例句 Play sentence</button>
      </div>
    `;
    grid.appendChild(card);
  });
}
function escapeAttr(str){ return str.replace(/"/g,'&quot;'); }

function highlightKeyWord(sentence, word){
  const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const left = /^\w/.test(word) ? '\\b' : '';
  const right = /\w$/.test(word) ? '\\b' : '';
  const re = new RegExp(left + '(' + esc + ')' + right, 'i');
  return sentence.replace(re, '<span class="key-word">$1</span>');
}

renderCards(VOCAB);

// ---------- filtering ----------
let currentCat = 'all';
const searchInput = document.getElementById('search');

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = VOCAB.filter(item => {
    const catOk = currentCat === 'all' || item.cat === currentCat;
    const qOk = !q || item.en.toLowerCase().includes(q) || item.zh.includes(q);
    return catOk && qOk;
  });
  renderCards(filtered);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
    applyFilter();
  });
});
searchInput.addEventListener('input', applyFilter);

// ---------- quiz mode ----------
const quizSwitch = document.getElementById('quizSwitch');
quizSwitch.addEventListener('click', () => {
  quizSwitch.classList.toggle('on');
  document.body.classList.toggle('quiz-mode');
});

// ---------- voice: fixed to Google US English ----------

// ---------- speech synthesis ----------
const voiceStatus = document.getElementById('voiceStatus');
let voices = [];
let chosenVoice = null;

function loadVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  // Prefer the exact "Google US English" voice (Chrome/Android). If it isn't
  // installed on this browser, fall back to the best available en-US voice.
  chosenVoice =
    voices.find(v => v.name === 'Google US English') ||
    voices.find(v => v.name.toLowerCase().includes('google') && v.lang === 'en-US') ||
    voices.find(v => v.lang === 'en-US') ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
    null;

  if(chosenVoice){
    voiceStatus.textContent = `🎙️ 使用語音：${chosenVoice.name} (${chosenVoice.lang})`;
  } else {
    voiceStatus.textContent = '⚠️ 尚未偵測到英文語音，建議使用 Chrome 瀏覽器開啟本頁';
  }
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
} else {
  voiceStatus.textContent = '⚠️ 此瀏覽器不支援語音朗讀功能';
}

// Add gentle punctuation-driven pauses so short A0-A1 sentences don't get
// read in one flat breath -- a comma/period gets a hair more silence,
// which reads as natural phrasing rather than a monotone string of words.
function withPacing(text){
  return text
    .replace(/,\s*/g, ', ')
    .replace(/\.\s*$/, '.')
    .trim();
}

function speakText(text, btn){
  if(!('speechSynthesis' in window)){
    alert('這個瀏覽器不支援語音朗讀功能，換個瀏覽器試試看吧！');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(withPacing(text));
  if(chosenVoice){ utter.voice = chosenVoice; utter.lang = chosenVoice.lang; }
  else { utter.lang = 'en-US'; }
  // Slightly gentler pitch/rate reads as calmer and more natural than
  // a flat 1.0/1.0, without dropping into "slow-motion robot" territory.
  utter.rate = 0.88;
  utter.pitch = 1.02;
  utter.volume = 1;

  document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
  if(btn){
    btn.classList.add('playing');
    utter.onend = () => btn.classList.remove('playing');
    utter.onerror = () => btn.classList.remove('playing');
  }
  window.speechSynthesis.speak(utter);
}

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-say]');
  if(!btn) return;
  speakText(btn.dataset.say, btn);
});
